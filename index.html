<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Riizq — Ferma boshqaruvi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"/>
<style>
:root{--background:#fbf8f1;--card:#ffffff;--primary:#c9a24a;--primary-hover:#b8923f;--primary-light:#f4ead2;--primary-dark:#7c6122;--ink:#2f2a1f;--ink-secondary:#645d4f;--ink-muted:#756d5e;--border:#e8dcbf;--input-border:#9c917c;--focus:#92620a;--success:#356b4a;--success-light:#e8f1eb;--danger:#a33c37;--danger-light:#f8e9e8;--warning:#92620a;--warning-light:#fdf3dc;--neutral-light:#f3efe6;--card-shadow:0 1px 2px rgba(60,45,10,.05),0 4px 16px rgba(60,45,10,.05);--radius-card:14px;--radius-ctrl:10px;}
*,*::before,*::after{box-sizing:border-box;}
html{color-scheme:light;}
body{margin:0;min-height:100dvh;background:var(--background);color:var(--ink);font-family:'Inter',ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button,[role=button]{cursor:pointer;}
button:disabled{cursor:not-allowed;opacity:.5;}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
::placeholder{color:var(--ink-muted);opacity:1;}
.app{display:flex;flex-direction:column;min-height:100dvh;}
.page{display:none;flex-direction:column;gap:24px;padding:20px 16px 100px;max-width:900px;margin:0 auto;width:100%;}
.page.active{display:flex;}
.auth-page{display:none;min-height:100dvh;align-items:center;justify-content:center;padding:24px 16px;}
.auth-page.active{display:flex;}
.header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:rgba(251,248,241,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.header-brand{display:flex;align-items:center;gap:10px;}
.farm-logo{display:grid;place-items:center;flex-shrink:0;width:38px;height:38px;border-radius:50%;background:linear-gradient(180deg,#e2c06c,#b4862c);color:#fff;font-size:14px;font-weight:700;}
.header-farm-name{font-weight:600;font-size:16px;}
.header-actions{display:flex;align-items:center;gap:8px;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-light);color:var(--primary-dark);display:grid;place-items:center;font-weight:600;font-size:14px;border:1.5px solid var(--border);cursor:pointer;}
.tabbar-wrap{--n:4;position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));z-index:35;width:min(calc(60px * var(--n) + 240px),calc(100% - 24px));margin:0 auto;}
.tabbar{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:5px;border-radius:999px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);border:.5px solid rgba(60,45,10,.08);box-shadow:0 10px 34px rgba(60,45,10,.14),0 2px 6px rgba(60,45,10,.06),inset 0 1px 0 rgba(255,255,255,.9);}
.tab-indicator{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px) / var(--n));border-radius:999px;background:rgba(201,162,74,.18);transform:translateX(calc(var(--active-tab,0) * 100%));transition:transform .5s cubic-bezier(.34,1.3,.64,1);}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;padding:6px 4px 5px;border:0;border-radius:999px;background:none;font:inherit;color:var(--ink);-webkit-tap-highlight-color:transparent;transition:color .25s,transform .15s;}
.tab:active{transform:scale(.93);}
.tab.active{color:var(--primary-dark);}
.tab svg{width:26px;height:26px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.tab.active svg{stroke-width:2.2;}
.tab-label{font-size:11px;font-weight:500;white-space:nowrap;}
.tab.active .tab-label{font-weight:600;}
.page-title{font-size:22px;font-weight:700;margin:0;}
.page-subtitle{color:var(--ink-secondary);margin:0;}
.card{background:var(--card);border-radius:var(--radius-card);border:1px solid var(--border);box-shadow:var(--card-shadow);overflow:hidden;}
.card-header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);}
.card-header-left{display:flex;align-items:center;gap:10px;}
.card-header-icon{color:var(--ink-secondary);display:grid;place-items:center;}
.card-header-icon svg{width:20px;height:20px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.card-title{font-size:16px;font-weight:600;margin:0;}
.card-desc{font-size:13px;color:var(--ink-secondary);margin:2px 0 0;}
.card-body{padding:16px 20px;}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:700px){.stat-grid{grid-template-columns:repeat(4,1fr);}}
.stat-card{background:var(--card);border-radius:var(--radius-card);border:1px solid var(--border);box-shadow:var(--card-shadow);padding:14px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:border-color .15s,box-shadow .15s;text-decoration:none;color:inherit;}
.stat-card:hover{border-color:var(--primary-hover);}
.stat-card-icon{color:var(--ink-secondary);margin-bottom:2px;}
.stat-card-icon svg{width:20px;height:20px;stroke-width:1.8;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.stat-card-value{font-size:22px;font-weight:700;line-height:1.2;}
.stat-card-label{font-size:13px;color:var(--ink-secondary);font-weight:500;}
.stat-card-secondary{font-size:12px;color:var(--ink-muted);}
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media(min-width:700px){.quick-grid{grid-template-columns:repeat(4,1fr);}}
.quick-action{display:flex;align-items:center;gap:12px;min-height:76px;border-radius:var(--radius-card);border:1px solid var(--border);background:var(--card);padding:12px 16px;box-shadow:var(--card-shadow);cursor:pointer;transition:border-color .15s,background .15s;text-decoration:none;color:inherit;}
.quick-action:hover{border-color:var(--primary-hover);background:rgba(244,234,210,.4);}
.quick-icon{display:inline-flex;width:44px;height:44px;flex-shrink:0;align-items:center;justify-content:center;border-radius:12px;background:var(--primary);color:var(--ink);}
.quick-icon svg{width:20px;height:20px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.quick-label{font-weight:600;font-size:14px;}
.quick-desc{font-size:12px;color:var(--ink-secondary);}
.bar-list{display:flex;flex-direction:column;gap:10px;}
.bar-item{display:flex;flex-direction:column;gap:4px;}
.bar-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;}
.bar-track{height:6px;background:var(--neutral-light);border-radius:999px;overflow:hidden;}
.bar-fill{height:100%;background:var(--primary);border-radius:999px;}
.data-table{width:100%;border-collapse:collapse;}
.data-table th{text-align:left;padding:10px 16px;font-size:12px;font-weight:600;color:var(--ink-secondary);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);background:var(--neutral-light);}
.data-table td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle;}
.data-table tr:last-child td{border-bottom:none;}
.data-table tbody tr{cursor:pointer;transition:background .12s;}
.data-table tbody tr:hover{background:var(--neutral-light);}
.th-right,.td-right{text-align:right!important;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;}
.badge-success{background:var(--success-light);color:var(--success);}
.badge-danger{background:var(--danger-light);color:var(--danger);}
.badge-warning{background:var(--warning-light);color:var(--warning);}
.badge-neutral{background:var(--neutral-light);color:var(--ink-secondary);}
.alert{padding:12px 16px;border-radius:var(--radius-card);border:1px solid;display:flex;gap:10px;font-size:14px;}
.alert-warning{background:var(--warning-light);border-color:#e8c97a;color:var(--warning);}
.alert svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.auth-card{background:var(--card);border-radius:20px;border:1px solid var(--border);box-shadow:0 8px 40px rgba(60,45,10,.12);padding:32px;width:100%;max-width:420px;}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:24px;text-align:center;}
.auth-logo-mark{width:56px;height:56px;border-radius:16px;background:linear-gradient(180deg,#e2c06c,#b4842a);display:grid;place-items:center;color:#fff;font-size:22px;font-weight:800;}
.auth-title{font-size:22px;font-weight:700;margin:0;}
.auth-subtitle{font-size:14px;color:var(--ink-secondary);margin:4px 0 0;}
.form-group{display:flex;flex-direction:column;gap:16px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field-label{font-size:14px;font-weight:500;}
.field-label span{color:var(--danger);margin-left:2px;}
.field-hint{font-size:12px;color:var(--ink-muted);}
.field-error{font-size:12px;color:var(--danger);}
input[type=text],input[type=tel],input[type=number],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--input-border);border-radius:var(--radius-ctrl);background:var(--card);color:var(--ink);font:inherit;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;}
input[type=text]:focus,input[type=tel]:focus,input[type=number]:focus,input[type=search]:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(201,162,74,.2);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 20px;border-radius:var(--radius-ctrl);font:inherit;font-size:15px;font-weight:600;border:none;cursor:pointer;transition:background .15s,box-shadow .15s;text-decoration:none;white-space:nowrap;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-hover);box-shadow:0 2px 8px rgba(201,162,74,.35);}
.btn-secondary{background:var(--neutral-light);color:var(--ink);border:1px solid var(--border);}
.btn-secondary:hover{background:var(--primary-light);}
.btn-ghost{background:none;color:var(--ink-secondary);padding:6px 10px;}
.btn-ghost:hover{background:var(--neutral-light);color:var(--ink);}
.btn-danger{background:var(--danger-light);color:var(--danger);border:1px solid #f0c0be;}
.btn-danger:hover{background:#f8d7d6;}
.btn-lg{padding:13px 24px;font-size:16px;}
.btn-sm{padding:7px 14px;font-size:13px;}
.btn-full{width:100%;}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.divider{display:flex;align-items:center;gap:12px;}
.divider-line{flex:1;height:1px;background:var(--border);}
.divider-text{font-size:13px;color:var(--ink-secondary);}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:var(--radius-ctrl);border:1.5px solid var(--border);background:var(--card);font:inherit;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer;transition:background .15s;}
.google-btn:hover{background:var(--neutral-light);}
.auth-switch{text-align:center;font-size:14px;color:var(--ink-secondary);margin-top:16px;}
.auth-switch a{color:var(--primary-dark);font-weight:500;text-decoration:underline;cursor:pointer;}
.auth-tabs{display:flex;background:var(--neutral-light);border-radius:var(--radius-ctrl);padding:4px;gap:4px;margin-bottom:24px;}
.auth-tab{flex:1;padding:9px 12px;border:none;border-radius:8px;font:inherit;font-size:14px;font-weight:500;background:none;color:var(--ink-muted);cursor:pointer;transition:background .2s,color .2s,box-shadow .2s;}
.auth-tab.active{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(60,45,10,.12);}
.movements-list{list-style:none;margin:0;padding:0;}
.movement-item{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--border);}
.movement-item:last-child{border-bottom:none;}
.movement-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.movement-dot-in{background:var(--success);}
.movement-dot-out{background:var(--danger);}
.movement-info{flex:1;min-width:0;}
.movement-name{font-size:14px;font-weight:500;}
.movement-date{font-size:12px;color:var(--ink-muted);}
.movement-qty{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
.movement-qty-in{color:var(--success);}
.movement-qty-out{color:var(--danger);}
@media(max-width:600px){.auth-card{padding:24px 20px;}.hide-mobile{display:none!important;}}
/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.hidden{display:none;}
.modal-box{background:var(--card);border-radius:16px;border:1px solid var(--border);width:100%;max-width:460px;max-height:90dvh;overflow-y:auto;box-shadow:0 20px 60px rgba(60,45,10,.25);}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-title{font-size:16px;font-weight:600;margin:0;}
.modal-body{padding:20px;}
.modal-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.modal-close{background:none;border:none;padding:4px;color:var(--ink-secondary);cursor:pointer;border-radius:6px;}
.modal-close:hover{background:var(--neutral-light);}
.modal-close svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;}
/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#2f2a1f;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;font-weight:500;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
/* Report */
.report-text{background:var(--neutral-light);border-radius:10px;padding:16px;font-size:14px;line-height:1.8;white-space:pre-wrap;}
</style>
</head>
<body>
<div class="app" id="app">

<!-- AUTH PAGE -->
<div class="auth-page active" id="pg-auth">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-mark">R</div>
      <h1 class="auth-title">Riizq</h1>
      <p class="auth-subtitle">Ferma boshqaruv tizimi</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login-btn" onclick="authTab('login')">Kirish</button>
      <button class="auth-tab" id="tab-reg-btn" onclick="authTab('reg')">Ro'yxatdan o'tish</button>
    </div>
    <div id="panel-login">
      <div class="form-group">
        <div class="field">
          <label class="field-label">Ism va familiya <span>*</span></label>
          <input id="login-name" type="text" placeholder="Masalan: Alisher Karimov" autocomplete="name"/>
        </div>
        <button class="btn btn-primary btn-lg btn-full" onclick="doLogin()">
          <svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Kirish
        </button>
        <div class="divider"><div class="divider-line"></div><span class="divider-text">yoki</span><div class="divider-line"></div></div>
        <button class="google-btn" onclick="doGoogleLogin()">
          <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google bilan kirish
        </button>
      </div>
    </div>
    <div id="panel-reg" style="display:none">
      <div class="form-group">
        <div class="field">
          <label class="field-label">Ism va familiya <span>*</span></label>
          <input id="reg-name" type="text" placeholder="Masalan: Alisher Karimov" autocomplete="name"/>
        </div>
        <button class="btn btn-primary btn-lg btn-full" onclick="doRegister()">
          <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          Ro'yxatdan o'tish
        </button>
        <div class="divider"><div class="divider-line"></div><span class="divider-text">yoki</span><div class="divider-line"></div></div>
        <button class="google-btn" onclick="doGoogleLogin()">
          <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google bilan kirish
        </button>
      </div>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="main-app" style="display:none;flex-direction:column;min-height:100dvh;">
  <header class="header">
    <div class="header-brand">
      <div class="farm-logo" id="farm-logo-initials">AB</div>
      <span class="header-farm-name" id="header-farm-name">Abdullayev fermasi</span>
    </div>
    <div class="header-actions">
      <div class="avatar" id="header-avatar">A</div>
    </div>
  </header>

  <!-- DASHBOARD -->
  <div class="page active" id="pg-dashboard"></div>

  <!-- ANIMALS -->
  <div class="page" id="pg-animals"></div>

  <!-- FEED -->
  <div class="page" id="pg-feed"></div>

  <!-- MORE -->
  <div class="page" id="pg-more"></div>

  <!-- Tab bar -->
  <nav class="tabbar-wrap">
    <div class="tabbar" style="--n:4">
      <div class="tab-indicator" id="tab-indicator"></div>
      <button class="tab active" id="tab-0" onclick="switchTab(0)">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span class="tab-label">Bosh sahifa</span>
      </button>
      <button class="tab" id="tab-1" onclick="switchTab(1)">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z"/><path d="M8.56 2.75c4.37 6.03 6.02 9.42 8.03 17.72m2.54-15.38c-3.72 4.35-8.94 5.66-16.88 5.85m19.5 1.9c-3.5-.93-6.63-.82-8.94 0-2.58.92-5.01 2.86-7.44 6.32"/></svg>
        <span class="tab-label">Hayvonlar</span>
      </button>
      <button class="tab" id="tab-2" onclick="switchTab(2)">
        <svg viewBox="0 0 24 24"><path d="M22 8.5V16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.5"/><path d="M2 6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6z"/></svg>
        <span class="tab-label">Yem ombori</span>
      </button>
      <button class="tab" id="tab-3" onclick="switchTab(3)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        <span class="tab-label">Boshqa</span>
      </button>
    </div>
  </nav>
</div>

<!-- MODAL -->

  <div class="modal-box" id="modal-box">
    <div class="modal-header">
      <h2 class="modal-title" id="modal-title">Modal</h2>
      <button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>

    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// =================== STATE ===================
const SEED = {
  animals: [
    {id:1,birka:'A-0042',laqab:'Sariqcha',tur:'Sigir',jins:'Ona',yoshOy:38,vazni:480,holati:'faol'},
    {id:2,birka:'Q-0018',laqab:'Oqtepa',tur:"Qo'y",jins:"Qo'chqor",yoshOy:20,vazni:62,holati:'faol'},
    {id:3,birka:'A-0031',laqab:'',tur:'Sigir',jins:'Buqa',yoshOy:49,vazni:620,holati:'faol'},
    {id:4,birka:'E-0005',laqab:'Qoracha',tur:'Echki',jins:'Ona',yoshOy:29,vazni:38,holati:'arxivda'},
    {id:5,birka:"Q-0027",laqab:'',tur:"Qo'y",jins:'Ona',yoshOy:8,vazni:0,holati:'faol'}
  ],
  feeds: [
    {id:1,nom:'Bedapoya',miqdor:3400,narx:1200,minimal:500},
    {id:2,nom:'Somon',miqdor:5800,narx:400,minimal:500},
    {id:3,nom:'Kombi yem',miqdor:1200,narx:3500,minimal:200},
    {id:4,nom:'Arpa',miqdor:120,narx:2800,minimal:500},
    {id:5,nom:'Temir sulfat',miqdor:0,narx:0,minimal:50},
    {id:6,nom:"Bug'doy kepagi",miqdor:1880,narx:1800,minimal:300}
  ],
  movements: [
    {id:1,feedId:1,feedNom:'Bedapoya',tur:'kirim',miqdor:500,sana:'2026-10-21T09:15'},
    {id:2,feedId:4,feedNom:'Arpa',tur:'sarf',miqdor:80,sana:'2026-10-21T08:00'},
    {id:3,feedId:3,feedNom:'Kombi yem',tur:'kirim',miqdor:600,sana:'2026-10-19T16:20'},
    {id:4,feedId:6,feedNom:"Bug'doy kepagi",tur:'sarf',miqdor:120,sana:'2026-10-19T07:30'}
  ],
  user: null,
  nextId: 100
};

let state;
function loadState() {
  try {
    const s = localStorage.getItem('riizq_state');
    state = s ? JSON.parse(s) : JSON.parse(JSON.stringify(SEED));
  } catch(e) {
    state = JSON.parse(JSON.stringify(SEED));
  }
  if (!state.movements) state.movements = JSON.parse(JSON.stringify(SEED.movements));
  if (!state.nextId) state.nextId = 100;
}
function saveState() {
  try { localStorage.setItem('riizq_state', JSON.stringify(state)); } catch(e) {}
}
function nextId() { return state.nextId++; }

// =================== UTILS ===================
function fmt(n) {
  if (n === undefined || n === null) return '0';
  return Number(n).toLocaleString('ru-RU');
}
function fmtAge(months) {
  if (!months) return '—';
  const y = Math.floor(months / 12);
  const m = months % 12;
  if (y === 0) return m + ' oy';
  if (m === 0) return y + ' yil';
  return y + ' yil ' + m + ' oy';
}
function fmtDate(sana) {
  if (!sana) return '';
  const d = new Date(sana);
  if (isNaN(d)) return sana;
  const day = String(d.getDate()).padStart(2,'0');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return day + '-' + months[d.getMonth()] + '-' + d.getFullYear() + ', ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function feedStatus(f) {
  if (f.miqdor === 0) return {cls:'badge-danger',txt:'Tugagan'};
  if (f.miqdor < f.minimal) return {cls:'badge-warning',txt:'Kam qoldi'};
  return {cls:'badge-success',txt:'Yetarli'};
}
function animalBadge(holati) {
  if (holati === 'faol') return '<span class="badge badge-success">Faol</span>';
  return '<span class="badge badge-neutral">Arxivda</span>';
}
function feedBadge(f) {
  const s = feedStatus(f);
  return `<span class="badge ${s.cls}">${s.txt}</span>`;
}

// =================== TOAST ===================
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// =================== MODAL ===================
let modalCallback = null;
function openModal(title, bodyHTML, footerHTML, cb) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal-footer').innerHTML = footerHTML;
  document.getElementById('modal-overlay').classList.remove('hidden');
  modalCallback = cb || null;
}
function closeModal() {
  document.getElementById('modal-overlay').classList.add('hidden');
  modalCallback = null;
}
function closeModalOnBackdrop(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}

// =================== AUTH ===================
function authTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('tab-login-btn').classList.toggle('active', isLogin);
  document.getElementById('tab-reg-btn').classList.toggle('active', !isLogin);
  document.getElementById('panel-login').style.display = isLogin ? '' : 'none';
  document.getElementById('panel-reg').style.display = isLogin ? 'none' : '';
}
function doLogin() {
  const val = (document.getElementById('login-name').value || '').trim();
  if (!val) { document.getElementById('login-name').focus(); return; }
  state.user = {name: val};
  saveState();
  showMainApp();
}
function doRegister() {
  const val = (document.getElementById('reg-name').value || '').trim();
  if (!val) { document.getElementById('reg-name').focus(); return; }
  state.user = {name: val};
  saveState();
  showMainApp();
}
function doGoogleLogin() {
  const name = prompt("Ism va familiyangizni kiriting:");
  if (!name || !name.trim()) return;
  state.user = {name: name.trim()};
  saveState();
  showMainApp();
}
function showMainApp() {
  document.getElementById('pg-auth').classList.remove('active');
  document.getElementById('main-app').style.display = 'flex';
  document.getElementById('main-app').style.flexDirection = 'column';
  const firstName = (state.user.name || 'Foydalanuvchi').split(' ')[0];
  document.getElementById('header-avatar').textContent = firstName[0].toUpperCase();
  switchTab(0);
}
function doLogout() {
  closeModal();
  state.user = null;
  saveState();
  document.getElementById('main-app').style.display = 'none';
  document.getElementById('pg-auth').classList.add('active');
  document.getElementById('login-name').value = '';
  document.getElementById('reg-name').value = '';
  authTab('login');
}

// =================== TABS ===================
let currentTab = 0;
function switchTab(idx) {
  document.getElementById('tab-indicator').style.setProperty('--active-tab', idx);
  for (let i = 0; i < 4; i++) {
    const btn = document.getElementById('tab-' + i);
    if (btn) btn.classList.toggle('active', i === idx);
  }
  const pages = ['pg-dashboard','pg-animals','pg-feed','pg-more'];
  pages.forEach((pid, i) => {
    const p = document.getElementById(pid);
    if (p) p.classList.toggle('active', i === idx);
  });
  currentTab = idx;
  if (idx === 0) renderDashboard();
  else if (idx === 1) renderAnimals();
  else if (idx === 2) renderFeed();
  else if (idx === 3) renderMore();
}

// =================== DASHBOARD ===================
function renderDashboard() {
  const totalAnimals = state.animals.length;
  const turGroups = [...new Set(state.animals.map(a => a.tur))];
  const totalFeedKg = state.feeds.reduce((s, f) => s + f.miqdor, 0);
  const totalFeedVal = state.feeds.reduce((s, f) => s + f.miqdor * f.narx, 0);

  const turCounts = {};
  state.animals.forEach(a => { turCounts[a.tur] = (turCounts[a.tur] || 0) + 1; });
  const maxCount = Math.max(...Object.values(turCounts), 1);

  const barsHTML = Object.entries(turCounts).map(([tur, cnt]) =>
    `<div class="bar-item">
      <div class="bar-row"><span>${tur}</span><span style="font-variant-numeric:tabular-nums;font-weight:600">${cnt} bosh</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${(cnt/maxCount*100).toFixed(1)}%"></div></div>
    </div>`
  ).join('');

  const lowFeeds = [...state.feeds].sort((a,b) => a.miqdor - b.miqdor).slice(0, 3);
  const feedRowsHTML = lowFeeds.map(f => {
    const st = feedStatus(f);
    return `<li style="display:flex;justify-content:space-between;align-items:center;padding:11px 20px;border-bottom:1px solid var(--border)">
      <span style="font-weight:500;font-size:14px">${f.nom}</span>
      <span style="display:flex;align-items:center;gap:8px;font-size:14px;font-variant-numeric:tabular-nums">
        <span class="badge ${st.cls}">${st.txt}</span> ${fmt(f.miqdor)} kg
      </span>
    </li>`;
  }).join('');

  const recentMoves = [...state.movements].reverse().slice(0, 4);
  const movesHTML = recentMoves.map(m =>
    `<li class="movement-item">
      <span class="movement-dot movement-dot-${m.tur === 'kirim' ? 'in' : 'out'}"></span>
      <div class="movement-info">
        <div class="movement-name">${m.feedNom} ${m.tur}</div>
        <div class="movement-date">${fmtDate(m.sana)}</div>
      </div>
      <span class="movement-qty movement-qty-${m.tur === 'kirim' ? 'in' : 'out'}">${m.tur === 'kirim' ? '+' : '-'}${fmt(m.miqdor)} kg</span>
    </li>`
  ).join('');

  const firstName = state.user ? (state.user.name || '').split(' ')[0] : '';

  document.getElementById('pg-dashboard').innerHTML = `
    <p class="page-subtitle">Assalomu alaykum, <strong style="color:var(--ink)">${firstName}</strong>! Bugungi holat.</p>

    <section>
      <div class="stat-grid">
        <div class="stat-card" onclick="switchTab(1)" style="cursor:pointer">
          <div class="stat-card-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z"/></svg></div>
          <div class="stat-card-value">${totalAnimals}</div>
          <div class="stat-card-label">Jami hayvonlar</div>
          <div class="stat-card-secondary">${Object.entries(turCounts).map(([t,c])=>t+': '+c).join(' · ')}</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></div>
          <div class="stat-card-value">${turGroups.length}</div>
          <div class="stat-card-label">Hayvon turlari</div>
          <div class="stat-card-secondary">${turGroups.join(', ')}</div>
        </div>
        <div class="stat-card" onclick="switchTab(2)" style="cursor:pointer">
          <div class="stat-card-icon"><svg viewBox="0 0 24 24"><path d="M22 8.5V16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.5"/><path d="M2 6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6z"/></svg></div>
          <div class="stat-card-value">${totalFeedKg >= 1000 ? (totalFeedKg/1000).toFixed(1)+' t' : fmt(totalFeedKg)+' kg'}</div>
          <div class="stat-card-label">Yem zaxirasi</div>
          <div class="stat-card-secondary">${state.feeds.length} turdagi yem</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-icon"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg></div>
          <div class="stat-card-value">${totalFeedVal >= 1000000 ? (totalFeedVal/1000000).toFixed(1)+' mln' : fmt(totalFeedVal)}</div>
          <div class="stat-card-label">Ombor qiymati</div>
          <div class="stat-card-secondary">so'm</div>
        </div>
      </div>
    </section>

    <section>
      <div class="quick-grid">
        <div class="quick-action" onclick="openAddAnimalModal()">
          <div class="quick-icon"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
          <div><div class="quick-label">Hayvon qo'shish</div><div class="quick-desc">Yangi bosh ro'yxatga</div></div>
        </div>
        <div class="quick-action" onclick="openAddFeedModal()">
          <div class="quick-icon"><svg viewBox="0 0 24 24"><path d="M5 3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H5z"/><path d="M12 8v8M8 12h8"/></svg></div>
          <div><div class="quick-label">Yem qo'shish</div><div class="quick-desc">Yangi yem turi</div></div>
        </div>
        <div class="quick-action" onclick="openRationModal()">
          <div class="quick-icon"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/></svg></div>
          <div><div class="quick-label">Yem hisoblash</div><div class="quick-desc">Miqdor va narx</div></div>
        </div>
        <div class="quick-action" onclick="openExpenseModal()">
          <div class="quick-icon"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>
          <div><div class="quick-label">Xarajat kiritish</div><div class="quick-desc">Xaridlar va xarajatlar</div></div>
        </div>
      </div>
    </section>

    <div style="display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
      <div class="card">
        <div class="card-header">
          <div class="card-header-left">
            <div class="card-header-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2z"/></svg></div>
            <p class="card-title">Hayvonlar bo'yicha</p>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="switchTab(1)">Barchasi</button>
        </div>
        <div class="card-body"><div class="bar-list">${barsHTML || '<p style="color:var(--ink-muted);font-size:14px">Hayvonlar yo\'q</p>'}</div></div>
      </div>
      <div class="card">
        <div class="card-header">
          <div class="card-header-left">
            <div class="card-header-icon"><svg viewBox="0 0 24 24"><path d="M22 8.5V16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8.5"/><path d="M2 6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6z"/></svg></div>
            <div><p class="card-title">Yem ombori holati</p><p class="card-desc">Eng kam qolgan yemlar</p></div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="switchTab(2)">Omborga</button>
        </div>
        <div class="card-body" style="padding:0"><ul style="list-style:none;margin:0;padding:0">${feedRowsHTML}</ul></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-header-left">
          <div class="card-header-icon"><svg viewBox="0 0 24 24"><path d="M3 3h7v7H3z"/><path d="M14 3h7v7h-7z"/><path d="M14 14h7v7h-7z"/><path d="M3 14h7v7H3z"/></svg></div>
          <p class="card-title">Yaqindagi ombor harakatlari</p>
        </div>
      </div>
      <ul class="movements-list">${movesHTML || '<li style="padding:16px 20px;color:var(--ink-muted);font-size:14px">Harakat yo\'q</li>'}</ul>
    </div>
  `;
}

// =================== ANIMALS ===================
let animalSearch = '', animalFilterTur = '', animalFilterAge = '';

function renderAnimals() {
  let filtered = state.animals.filter(a => {
    const q = animalSearch.toLowerCase();
    if (q && !a.birka.toLowerCase().includes(q) && !(a.laqab||'').toLowerCase().includes(q)) return false;
    if (animalFilterTur && a.tur !== animalFilterTur) return false;
    if (animalFilterAge === 'buzoq' && a.yoshOy > 6) return false;
    if (animalFilterAge === 'osmir' && (a.yoshOy <= 6 || a.yoshOy > 24)) return false;
    if (animalFilterAge === 'katta' && a.yoshOy <= 24) return false;
    return true;
  });

  const rowsHTML = filtered.map(a => `
    <tr>
      <td><div><p style="font-weight:600;margin:0">${a.birka}</p>${a.laqab ? `<p style="font-size:12px;color:var(--ink-secondary);margin:2px 0 0">${a.laqab}</p>` : ''}</div></td>
      <td>${a.tur} · ${a.jins}</td>
      <td>${fmtAge(a.yoshOy)}</td>
      <td class="td-right" style="font-variant-numeric:tabular-nums">${a.vazni ? fmt(a.vazni)+' kg' : '—'}</td>
      <td>${animalBadge(a.holati)}</td>
      <td class="td-right hide-mobile">
        <div style="display:flex;gap:4px;justify-content:flex-end">
          <button class="btn btn-ghost btn-sm" style="padding:5px 8px" onclick="openEditAnimalModal(${a.id})">
            <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn btn-ghost btn-sm" style="padding:5px 8px;color:var(--danger)" onclick="confirmDeleteAnimal(${a.id})">
            <svg viewBox="0 0 24 24" style="width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        </div>
      </td>
    </tr>`).join('');

  document.getElementById('pg-animals').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
      <h1 class="page-title">Hayvonlar</h1>
      <button class="btn btn-primary btn-sm" onclick="openAddAnimalModal()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Hayvon qo'shish
      </button>
    </div>
    <div class="card">
      <div style="padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center">
        <div style="flex:1;min-width:200px;position:relative">
          <svg viewBox="0 0 24 24" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--ink-secondary);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" placeholder="Birka raqami yoki laqab" style="padding-left:36px" value="${animalSearch}" oninput="animalSearch=this.value;renderAnimals()"/>
        </div>
        <select style="width:160px" onchange="animalFilterTur=this.value;renderAnimals()">
          <option value="">Barcha turlar</option>
          <option value="Sigir"${animalFilterTur==='Sigir'?' selected':''}>Sigir</option>
          <option value="Qo'y"${animalFilterTur==="Qo'y"?' selected':''}>Qo'y</option>
          <option value="Echki"${animalFilterTur==='Echki'?' selected':''}>Echki</option>
          <option value="Ot"${animalFilterTur==='Ot'?' selected':''}>Ot</option>
          <option value="Cho'chqa"${animalFilterTur==="Cho'chqa"?' selected':''}>Cho'chqa</option>
        </select>
        <select style="width:160px" onchange="animalFilterAge=this.value;renderAnimals()">
          <option value="">Barcha yoshlar</option>
          <option value="buzoq"${animalFilterAge==='buzoq'?' selected':''}>Buzoq (0–6 oy)</option>
          <option value="osmir"${animalFilterAge==='osmir'?' selected':''}>O'smir (6–24 oy)</option>
          <option value="katta"${animalFilterAge==='katta'?' selected':''}>Katta (24+ oy)</option>
        </select>
      </div>
      <div style="padding:8px 20px;border-top:1px solid var(--border);font-size:13px;color:var(--ink-secondary)">${filtered.length} ta hayvon</div>
    </div>
    <div class="card" style="overflow:auto">
      <table class="data-table">
        <thead><tr>
          <th>Birka / laqab</th><th>Turi</th><th>Yoshi</th>
          <th class="th-right">Vazni</th><th>Holati</th>
          <th class="th-right hide-mobile">Amallar</th>
        </tr></thead>
        <tbody>${rowsHTML || '<tr><td colspan="6" style="text-align:center;color:var(--ink-muted);padding:24px">Hayvon topilmadi</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

function animalFormHTML(a) {
  return `
    <div class="form-group">
      <div class="field">
        <label class="field-label">Birka raqami <span>*</span></label>
        <input type="text" id="af-birka" value="${a ? a.birka : ''}" placeholder="Masalan: A-0042"/>
      </div>
      <div class="field">
        <label class="field-label">Laqabi</label>
        <input type="text" id="af-laqab" value="${a ? (a.laqab||'') : ''}" placeholder="Ixtiyoriy"/>
      </div>
      <div class="field">
        <label class="field-label">Turi <span>*</span></label>
        <select id="af-tur">
          ${['Sigir',"Qo'y",'Echki','Ot',"Cho'chqa"].map(t=>`<option${a&&a.tur===t?' selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="field">

function openKirimModal(feedId) {
  const f = state.feeds.find(x => x.id === feedId);
  if (!f) return;
  openModal(f.nom + " — kirim",
    `<div class="form-group">
      <div class="field">
        <label class="field-label">Miqdor (kg) <span>*</span></label>
        <input type="number" id="km-miqdor" placeholder="Masalan: 500" min="1"/>
      </div>
      <div class="field">
        <label class="field-label">1 kg narxi (so'm)</label>
        <input type="number" id="km-narx" value="${f.narx || ''}" placeholder="${f.narx || 'Masalan: 1200'}" min="0"/>
        <span class="field-hint">Hozirgi narx: ${fmt(f.narx)} so'm/kg</span>
      </div>
    </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Bekor qilish</button>
     <button class="btn btn-primary" onclick="doKirim(${feedId})">Kirim qilish</button>`
  );
}
function doKirim(feedId) {
  const miqdor = parseFloat(document.getElementById('km-miqdor').value) || 0;
  if (miqdor <= 0) { alert("Miqdorni kiriting!"); return; }
  const narxVal = parseFloat(document.getElementById('km-narx').value) || 0;
  const f = state.feeds.find(x => x.id === feedId);
  if (!f) return;
  f.miqdor += miqdor;
  if (narxVal > 0) f.narx = narxVal;
  state.movements.push({id: nextId(), feedId, feedNom: f.nom, tur:'kirim', miqdor, sana: new Date().toISOString().slice(0,16)});
  saveState();
  closeModal();
  showToast(`${f.nom}: +${fmt(miqdor)} kg kirim ✓`);
  renderFeed();
}

function openSarfModal(feedId) {
  const f = state.feeds.find(x => x.id === feedId);
  if (!f || f.miqdor === 0) return;
  openModal(f.nom + " — sarf",
    `<div class="form-group">
      <div class="field">
        <label class="field-label">Miqdor (kg) <span>*</span></label>
        <input type="number" id="sm-miqdor" placeholder="Masalan: 100" min="1" max="${f.miqdor}"/>
        <span class="field-hint">Mavjud: ${fmt(f.miqdor)} kg</span>
      </div>
    </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Bekor qilish</button>
     <button class="btn btn-primary" onclick="doSarf(${feedId})">Sarf qilish</button>`
  );
}
function doSarf(feedId) {
  const miqdor = parseFloat(document.getElementById('sm-miqdor').value) || 0;
  if (miqdor <= 0) { alert("Miqdorni kiriting!"); return; }
  const f = state.feeds.find(x => x.id === feedId);
  if (!f) return;
  if (miqdor > f.miqdor) { alert(`Mavjud miqdordan ko'p: ${fmt(f.miqdor)} kg`); return; }
  f.miqdor -= miqdor;
  state.movements.push({id: nextId(), feedId, feedNom: f.nom, tur:'sarf', miqdor, sana: new Date().toISOString().slice(0,16)});
  saveState();
  closeModal();
  showToast(`${f.nom}: -${fmt(miqdor)} kg sarf ✓`);
  renderFeed();
}

function openRationModal() {
  const turOpts = [...new Set(state.animals.map(a => a.tur))].map(t => `<option value="${t}">${t}</option>`).join('');
  openModal("Yem ratsionini hisoblash",
    `<div class="form-group">

function calcRation() {
  const tur = document.getElementById('rn-tur').value;
  const son = parseInt(document.getElementById('rn-son').value) || 0;
  const kun = parseInt(document.getElementById('rn-kun').value) || 0;
  if (!son || !kun) { alert("Soni va kunlarni kiriting!"); return; }
  const kgPerDay = tur === 'Sigir' ? 5 : 2;
  const total = son * kgPerDay * kun;
  document.getElementById('rn-result').innerHTML =
    `<div class="report-text">${tur} · ${son} bosh · ${kun} kun:\n\nKunlik talab: ${fmt(son*kgPerDay)} kg\nJami talab: ${fmt(total)} kg\n(Hisob: ${kgPerDay} kg/bosh/kun)</div>`;
}

}
function openProfilModal() {
  const user = state.user || {};
  openModal("Profil",
    `<div class="form-group">
      <div class="field">
        <label class="field-label">Ism va familiya</label>
        <input type="text" id="pr-nom" value="${user.name || ''}"/>
      </div>
    </div>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Bekor qilish</button>
     <button class="btn btn-primary" onclick="saveProfil()">Saqlash</button>`
  );
}
function saveProfil() {
  const nom = document.getElementById('pr-nom').value.trim();
  if (nom) {
    state.user = {name: nom};
    saveState();
    const firstName = nom.split(' ')[0];
    document.getElementById('header-avatar').textContent = firstName[0].toUpperCase();
    showToast("Profil yangilandi ✓");
    closeModal();
    renderMore();
  }
}
function confirmLogout() {
  openModal("Chiqish",
    `<p>Tizimdan chiqmoqchimisiz?</p>`,
    `<button class="btn btn-secondary" onclick="closeModal()">Bekor qilish</button>
     <button class="btn btn-danger" onclick="doLogout()">Chiqish</button>`
  );
}

// =================== INIT ===================
loadState();
if (state.user) {
  document.getElementById('pg-auth').classList.remove('active');
  document.getElementById('main-app').style.display = 'flex';
  document.getElementById('main-app').style.flexDirection = 'column';
  const firstName = (state.user.name || 'F').split(' ')[0];
  document.getElementById('header-avatar').textContent = firstName[0].toUpperCase();
  if (state.farmName) document.getElementById('header-farm-name').textContent = state.farmName;
  switchTab(0);
}
</script>
</body>
</html>
